# Camera salumi — nodo in camera (XIAO ESP32C3 + Seeed RS485 Breakout)
#
# Sta nella scatola stagna X6 dentro la camera. Legge bilancia, sonde di
# parete e pavimento e giri delle ventole, comanda il PWM delle ventole.
# Sul bus RS485 è un dispositivo comandato (server Modbus, indirizzo 4):
# la Waveshare (salumi-camera.yaml) lo interroga e gli scrive la velocità
# delle ventole. Non governa nulla da solo.
#
# DA FLASHARE SOLO ALLA MIGRAZIONE: oggi la stessa XIAO gira con
# sonda-th.yaml e passa a HA le letture della S-TH-01. Con questo firmware
# la S-TH-01 la legge direttamente la Waveshare.
#
# Pin XIAO ESP32C3: D0=GPIO2 D1=GPIO3 D2=GPIO4 D3=GPIO5 D4=GPIO6 D5=GPIO7
#                   D6=GPIO21 D7=GPIO20 D8=GPIO8 D9=GPIO9 D10=GPIO10
#   RS485 (breakout): TX D4, RX D5, direzione D2
#   HX711: DOUT D1, SCK D3 (come su sonda-th)
#   DS18B20 parete + pavimento: D10, pull-up 4,7 kΩ verso 3V3
#   PWM ventole: D7 → modulo MOSFET A2 (uscita invertita)
#   Giri ventola M5: D0 · M6: D8 · M7: D6, pull-up interne
#   D9 (tasto BOOT) libero: non usarlo per i giri (basso all'avvio = programmazione).
#   D0 e D8 sono pin di strapping, ma decidono l'avvio solo se D9 è basso:
#   con il pull-up restano alti e vanno bene come ingressi dei giri.
#
# Mappa dei registri (holding, lettura 0x03, scrittura 0x06/0x10):
#   0x0000  versione della mappa (1)
#   0x0001  battito: +1 al secondo (se non cambia, il nodo è fermo)
#   0x0002  peso grezzo HX711, S_DWORD, parola alta prima
#   0x0003    (INT32_MIN = lettura non valida)
#   0x0004  T parete ×100, S_WORD (−32768 = non valida)
#   0x0005  T pavimento ×100, S_WORD (−32768 = non valida)
#   0x0006  giri ventola M5, giri/min
#   0x0007  giri ventola M6, giri/min
#   0x0008  PWM ventole applicato, %
#   0x0009  stato: bit0 ventole in sicurezza (Waveshare silente),
#           bit1 HX711 valido, bit2 parete valida, bit3 pavimento valido
#   0x000A  giri ventola M7, giri/min
#   0x0010  PWM ventole richiesto, % (0–100), lettura e scrittura
#
# Sicurezza: se la Waveshare non scrive 0x0010 per 90 s (la riscrive ogni
# 30 s), le ventole vanno a ${pwm_sicurezza} %.

substitutions:
  indirizzo_modbus: "4"
  pwm_sicurezza: "0"
  silenzio_max_ms: "90000"

esphome:
  name: salumi-nodo
  friendly_name: Nodo camera salumi
  on_boot:
    - priority: 800
      then:
        - output.set_level:
            id: pwm_ventole
            level: ${pwm_sicurezza}%

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf

logger:

# Wi-Fi e HA servono solo per aggiornamenti e diagnostica. Senza rete il
# nodo deve continuare a lavorare: niente riavvii automatici.
api:
  encryption:
    key: !secret salumi_nodo_api_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  reboot_timeout: 0s
  ap:
    ssid: "Salumi-Nodo Fallback"
    password: !secret ap_password

captive_portal:

debug:
  update_interval: 5min

globals:
  - id: battito
    type: uint16_t
    initial_value: "0"
  # PWM chiesto dalla Waveshare (%) e istante dell'ultima scrittura
  - id: pwm_richiesto
    type: uint16_t
    initial_value: ${pwm_sicurezza}
  - id: ultima_scrittura
    type: uint32_t
    initial_value: "0"
  - id: pwm_applicato
    type: uint16_t
    initial_value: ${pwm_sicurezza}
  - id: in_sicurezza
    type: bool
    initial_value: "true"

# --- RS485 -------------------------------------------------------------------
uart:
  id: bus485
  tx_pin: GPIO6   # D4
  rx_pin: GPIO7   # D5
  baud_rate: 9600

modbus:
  id: modbus485
  uart_id: bus485
  role: server
  flow_control_pin: GPIO4   # D2, HIGH = trasmissione

modbus_server:
  - modbus_id: modbus485
    address: ${indirizzo_modbus}
    registers:
      - address: 0x0000
        value_type: U_WORD
        read_lambda: return 1;
      - address: 0x0001
        value_type: U_WORD
        read_lambda: return id(battito);
      - address: 0x0002
        value_type: S_DWORD
        read_lambda: |-
          float v = id(peso_grezzo).state;
          if (isnan(v)) return INT32_MIN;
          return (int32_t) v;
      - address: 0x0004
        value_type: S_WORD
        read_lambda: |-
          float v = id(t_parete).state;
          if (isnan(v)) return -32768;
          return (int16_t) lroundf(v * 100.0f);
      - address: 0x0005
        value_type: S_WORD
        read_lambda: |-
          float v = id(t_pavimento).state;
          if (isnan(v)) return -32768;
          return (int16_t) lroundf(v * 100.0f);
      - address: 0x0006
        value_type: U_WORD
        read_lambda: |-
          float v = id(giri_m5).state;
          return isnan(v) ? 0 : (uint16_t) lroundf(v);
      - address: 0x0007
        value_type: U_WORD
        read_lambda: |-
          float v = id(giri_m6).state;
          return isnan(v) ? 0 : (uint16_t) lroundf(v);
      - address: 0x0008
        value_type: U_WORD
        read_lambda: return id(pwm_applicato);
      - address: 0x0009
        value_type: U_WORD
        read_lambda: |-
          uint16_t s = 0;
          if (id(in_sicurezza)) s |= 1;
          if (!isnan(id(peso_grezzo).state)) s |= 2;
          if (!isnan(id(t_parete).state)) s |= 4;
          if (!isnan(id(t_pavimento).state)) s |= 8;
          return s;
      - address: 0x000A
        value_type: U_WORD
        read_lambda: |-
          float v = id(giri_m7).state;
          return isnan(v) ? 0 : (uint16_t) lroundf(v);
      - address: 0x0010
        value_type: U_WORD
        read_lambda: return id(pwm_richiesto);
        write_lambda: |-
          if (x > 100) return false;
          id(pwm_richiesto) = x;
          id(ultima_scrittura) = millis();
          id(applica_pwm).execute();
          return true;

# --- Ventole -----------------------------------------------------------------
# D7 comanda il modulo MOSFET A2, che porta a massa il filo PWM delle ventole:
# uscita invertita. XIAO spenta o in avvio = ventole al massimo.
# 1000 Hz: a 20 kHz il modulo è troppo lento a spegnersi (prova al banco del
# 30/10/2026: 50 % → 0 giri a 20 kHz, 858 giri a 1 kHz; curva regolare, nessun fischio).
output:
  - platform: ledc
    id: pwm_ventole
    pin: GPIO20   # D7
    frequency: 1000Hz
    inverted: true

script:
  - id: applica_pwm
    mode: restart
    then:
      - lambda: |-
          bool silente = id(ultima_scrittura) == 0 ||
                         millis() - id(ultima_scrittura) > ${silenzio_max_ms};
          if (silente && !id(in_sicurezza))
            ESP_LOGW("nodo", "Waveshare silente: ventole a ${pwm_sicurezza} %%");
          id(in_sicurezza) = silente;
          id(pwm_applicato) = silente ? ${pwm_sicurezza} : id(pwm_richiesto);
          id(pwm_ventole).set_level(id(pwm_applicato) / 100.0f);

interval:
  - interval: 1s
    then:
      - lambda: id(battito)++;
  - interval: 10s
    then:
      - script.execute: applica_pwm

# --- Sensori -----------------------------------------------------------------
one_wire:
  - platform: gpio
    pin: GPIO10   # D10

sensor:
  # Peso grezzo: la conversione in grammi (tara e fattore) la fa la Waveshare.
  - platform: hx711
    id: peso_grezzo
    name: "Peso grezzo"
    dout_pin: GPIO3   # D1
    clk_pin: GPIO5    # D3
    gain: 128
    update_interval: 2s
    accuracy_decimals: 0
    entity_category: diagnostic
    filters:
      - median:
          window_size: 5
          send_every: 5

  # Al primo avvio il log elenca le sonde trovate ("Found sensors: 0x...").
  # Scaldarne una in mano per capire quale è quale e mettere qui gli
  # indirizzi. Con i segnaposto le letture risultano non valide.
  - platform: dallas_temp
    id: t_parete
    name: "Temperatura parete"
    address: 0x0000000000000001
    update_interval: 30s
  - platform: dallas_temp
    id: t_pavimento
    name: "Temperatura pavimento"
    address: 0x0000000000000002
    update_interval: 30s

  # Giri ventole (2 impulsi a giro: impulsi al minuto × 0,5 = giri/min)
  - platform: pulse_counter
    id: giri_m5
    name: "Giri ventola 1"
    pin:
      number: GPIO2   # D0
      ignore_strapping_warning: true
      mode:
        input: true
        pullup: true
    unit_of_measurement: "rpm"
    accuracy_decimals: 0
    update_interval: 10s
    filters:
      - multiply: 0.5
  - platform: pulse_counter
    id: giri_m6
    name: "Giri ventola 2"
    pin:
      number: GPIO8   # D8
      ignore_strapping_warning: true
      mode:
        input: true
        pullup: true
    unit_of_measurement: "rpm"
    accuracy_decimals: 0
    update_interval: 10s
    filters:
      - multiply: 0.5
  - platform: pulse_counter
    id: giri_m7
    name: "Giri ventola 3"
    pin:
      number: GPIO21   # D6
      mode:
        input: true
        pullup: true
    unit_of_measurement: "rpm"
    accuracy_decimals: 0
    update_interval: 10s
    filters:
      - multiply: 0.5

  - platform: template
    name: "PWM ventole"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 30s
    lambda: return id(pwm_applicato);

  - platform: wifi_signal
    name: "Segnale WiFi"
    update_interval: 60s
  - platform: uptime
    name: "Tempo acceso"
    update_interval: 60s

binary_sensor:
  - platform: template
    name: "Ventole in sicurezza"
    device_class: problem
    lambda: return id(in_sicurezza);

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "Indirizzo IP"
  - platform: debug
    reset_reason:
      name: "Motivo ultimo riavvio"
