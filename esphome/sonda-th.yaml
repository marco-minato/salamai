# XIAO ESP32C3 + RS485 Breakout (113991354) nella scatola X6: bilancia, sonde
# DS18B20 e ventole. La sonda S-TH-01 non è più letta da qui (vedi RS485).
#
# Pin XIAO ESP32C3: D0=GPIO2 D1=GPIO3 D2=GPIO4 D3=GPIO5 D4=GPIO6 D5=GPIO7
#                   D6=GPIO21 D7=GPIO20 D8=GPIO8 D9=GPIO9 D10=GPIO10
# Evitare D0/D8/D9 (strapping).
esphome:
  name: sonda-th
  friendly_name: Sonda TH

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Il risparmio energetico (default su ESP32) con alcuni router fa cadere la connessione
  power_save_mode: none
  ap:
    ssid: "Sonda-TH Fallback"
    password: !secret ap_password

captive_portal:

# Diagnostica connessione / riavvii
debug:
  update_interval: 5min

text_sensor:
  - platform: wifi_info
    bssid:
      name: "Access point (BSSID)"
    ssid:
      name: "Rete Wi-Fi"
    ip_address:
      name: "Indirizzo IP"
  - platform: debug
    reset_reason:
      name: "Motivo ultimo riavvio"

# RS485: dal 07/11/2026 la S-TH-01 la legge solo la Waveshare del quadro
# (stesso bus, tramite il Cat5e). La XIAO non interroga più nessuno: D2 resta
# basso, così la breakout RS485 sta in ricezione e non disturba il bus.
switch:
  - platform: gpio
    id: rs485_ricezione
    pin: GPIO4   # D2, HIGH = trasmissione
    restore_mode: ALWAYS_OFF
    internal: true

sensor:
  - platform: wifi_signal
    name: "Segnale WiFi"
    update_interval: 60s
  - platform: uptime
    name: "Tempo acceso"
    update_interval: 60s

  # Bilancia HX711 (DOUT D1, SCK D3). "Peso grezzo" serve a calibrare:
  # leggerlo a vuoto (gancio compreso) e con un peso noto, poi mettere
  # i due valori in calibrate_linear di "Peso".
  - platform: hx711
    id: peso_grezzo
    name: "Peso grezzo"
    dout_pin: GPIO3   # D1
    clk_pin: GPIO5    # D3
    gain: 128
    update_interval: 10s
    accuracy_decimals: 0
    entity_category: diagnostic
    filters:
      # una lettura al minuto, mediana di 6 per scartare i picchi
      - median:
          window_size: 6
          send_every: 6
  - platform: copy
    source_id: peso_grezzo
    name: "Peso"
    unit_of_measurement: g
    device_class: weight
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - calibrate_linear:
          # Tarata il 06/11/2026: a vuoto (gancio compreso) e con 443 g appesi
          - 6741 -> 0
          - 439600 -> 443

