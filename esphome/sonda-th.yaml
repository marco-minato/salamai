# Sonda Seeed S-TH-01 (101990881) su XIAO ESP32C3 + RS485 Breakout (113991354)
#
# Pin XIAO ESP32C3: D0=GPIO2 D1=GPIO3 D2=GPIO4 D3=GPIO5 D4=GPIO6 D5=GPIO7
#                   D6=GPIO21 D7=GPIO20 D8=GPIO8 D9=GPIO9 D10=GPIO10
# Evitare D0/D8/D9 (strapping).
esphome:
  name: sonda-th
  friendly_name: Sonda TH

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Il risparmio energetico (default su ESP32) con alcuni router fa cadere la connessione
  power_save_mode: none
  ap:
    ssid: "Sonda-TH Fallback"
    password: !secret ap_password

captive_portal:

# Diagnostica connessione / riavvii
debug:
  update_interval: 5min

text_sensor:
  - platform: wifi_info
    bssid:
      name: "Access point (BSSID)"
    ssid:
      name: "Rete Wi-Fi"
    ip_address:
      name: "Indirizzo IP"
  - platform: debug
    reset_reason:
      name: "Motivo ultimo riavvio"

uart:
  rx_pin: GPIO7   # D5
  tx_pin: GPIO6   # D4
  baud_rate: 9600

modbus:
  flow_control_pin: GPIO4   # D2, HIGH = trasmissione

modbus_controller:
  - id: sth01
    address: 0x1
    update_interval: 30s

sensor:
  - platform: modbus_controller
    modbus_controller_id: sth01
    name: "Temperatura"
    # invia anche valori uguali: il controllo "sensore fermo" di HA guarda l'ultima lettura
    force_update: true
    register_type: holding
    address: 0x0000
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
  - platform: modbus_controller
    modbus_controller_id: sth01
    name: "Umidità"
    # invia anche valori uguali: il controllo "sensore fermo" di HA guarda l'ultima lettura
    force_update: true
    register_type: holding
    address: 0x0001
    value_type: U_WORD
    unit_of_measurement: "%"
    device_class: humidity
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.01
  - platform: modbus_controller
    modbus_controller_id: sth01
    name: "Dew point"
    register_type: holding
    address: 0x0002
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
  - platform: wifi_signal
    name: "Segnale WiFi"
    update_interval: 60s
  - platform: uptime
    name: "Tempo acceso"
    update_interval: 60s

  # Bilancia HX711 (DOUT D1, SCK D3). "Peso grezzo" serve a calibrare:
  # leggerlo a vuoto (gancio compreso) e con un peso noto, poi mettere
  # i due valori in calibrate_linear di "Peso".
  - platform: hx711
    id: peso_grezzo
    name: "Peso grezzo"
    dout_pin: GPIO3   # D1
    clk_pin: GPIO5    # D3
    gain: 128
    update_interval: 10s
    accuracy_decimals: 0
    entity_category: diagnostic
    filters:
      # una lettura al minuto, mediana di 6 per scartare i picchi
      - median:
          window_size: 6
          send_every: 6
  - platform: copy
    source_id: peso_grezzo
    name: "Peso"
    unit_of_measurement: g
    device_class: weight
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - calibrate_linear:
          # DA CALIBRARE: lettura grezza -> grammi
          - 0 -> 0
          - 100000 -> 1000

