# Camera salumi — Waveshare ESP32-S3-Relay-6CH
#
# FIRMWARE DI PROVA (banco e test di preriscaldo a camera vuota).
# Comandi manuali da HA + termostato semplice + sicurezze di base.
# La logica del ciclo (fasi, ricambi, umidità) arriva dopo i test:
# vedi /homeassistant/salumi/specifiche_firmware.md.
#
# Pin (specifiche_firmware.md §2):
#   relè CH1–CH3 lampade GPIO1/2/41, CH4–CH5 umidificatori GPIO42/45,
#   CH6 estrattore GPIO46 · RS485 GPIO17/18 · RTC SDA GPIO4 SCL GPIO5
#
# Bus RS485 (9600 8N1): sonda camera S-TH-01 = 1, contatore SDM120 = 2,
# sonda cantina S-TH-01 = 3, nodo in camera (XIAO, salumi-nodo.yaml) = 4.
# Il nodo porta bilancia, sonde di parete e pavimento e ventole: la
# temperatura della camera arriva invece direttamente dalla S-TH-01, così
# la stufa non dipende dal nodo.
#
# Sicurezze:
#   - all'avvio tutti i relè spenti (CH5/CH6 sono pin di strapping);
#   - sonda camera senza letture per 5 min → lampade e umidificatori spenti;
#   - camera oltre 30 °C → termostato e lampade spenti;
#   - estrattore e umidificatori mai insieme;
#   - senza HA o Wi-Fi nessun riavvio automatico: la scheda continua da sola.

substitutions:
  t_massima: "30"

esphome:
  name: salumi-camera
  friendly_name: Camera salumi
  on_boot:
    - priority: 800
      then:
        - switch.turn_off: lampada_1
        - switch.turn_off: lampada_2
        - switch.turn_off: lampada_3
        - switch.turn_off: umidificatore_1
        - switch.turn_off: umidificatore_2
        - switch.turn_off: estrattore
    # ora dal DS3231 finché HA non è collegato
    - priority: 600
      then:
        - ds1307.read_time: rtc

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 8MB
  framework:
    type: esp-idf

logger:

# Senza questi due reboot_timeout la scheda si riavvierebbe dopo 15 min
# senza HA o senza Wi-Fi, fermando il ciclo.
api:
  encryption:
    key: !secret salumi_api_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  reboot_timeout: 0s
  ap:
    ssid: "Salumi-Camera Fallback"
    password: !secret ap_password

captive_portal:

debug:
  update_interval: 5min

globals:
  # ultimo istante (millis) con una lettura valida della sonda camera
  - id: ultima_lettura
    type: uint32_t
    initial_value: "0"
  # battito del nodo in camera: ultimo valore letto e quando è cambiato
  - id: battito_nodo
    type: int
    initial_value: "-1"
  - id: battito_nodo_cambiato
    type: uint32_t
    initial_value: "0"

# --- Ora: HA, con il DS3231 di riserva --------------------------------------
i2c:
  sda: GPIO4
  scl: GPIO5

time:
  - platform: homeassistant
    id: ora_ha
    on_time_sync:
      then:
        - ds1307.write_time: rtc
  - platform: ds1307
    id: rtc
    update_interval: never

# --- Relè ------------------------------------------------------------------
switch:
  - platform: gpio
    id: lampada_1
    name: "Lampada 1"
    pin: GPIO1
    restore_mode: ALWAYS_OFF
    icon: mdi:heat-wave
  - platform: gpio
    id: lampada_2
    name: "Lampada 2"
    pin: GPIO2
    restore_mode: ALWAYS_OFF
    icon: mdi:heat-wave
  - platform: gpio
    id: lampada_3
    name: "Lampada 3"
    pin: GPIO41
    restore_mode: ALWAYS_OFF
    icon: mdi:heat-wave
  - platform: gpio
    id: umidificatore_1
    name: "Umidificatore 1"
    pin: GPIO42
    restore_mode: ALWAYS_OFF
    icon: mdi:air-humidifier
    on_turn_on:
      - switch.turn_off: estrattore
  - platform: gpio
    id: umidificatore_2
    name: "Umidificatore 2"
    pin:
      number: GPIO45
      ignore_strapping_warning: true
    restore_mode: ALWAYS_OFF
    icon: mdi:air-humidifier
    on_turn_on:
      - switch.turn_off: estrattore
  - platform: gpio
    id: estrattore
    name: "Estrattore"
    pin:
      number: GPIO46
      ignore_strapping_warning: true
    restore_mode: ALWAYS_OFF
    icon: mdi:fan-chevron-up
    on_turn_on:
      - switch.turn_off: umidificatore_1
      - switch.turn_off: umidificatore_2

# --- Termostato (preriscaldo e prove) -------------------------------------------
number:
  - platform: template
    id: n_lampade
    name: "Lampade del termostato"
    icon: mdi:numeric
    optimistic: true
    min_value: 1
    max_value: 3
    step: 1
    initial_value: 3
    restore_value: true
    on_value:
      - if:
          condition:
            lambda: return id(stufa).action == climate::CLIMATE_ACTION_HEATING;
          then:
            - script.execute: lampade_accendi

script:
  # accende quante lampade dice "Lampade del termostato", 2 s l'una dall'altra
  - id: lampade_accendi
    mode: restart
    then:
      - switch.turn_on: lampada_1
      - if:
          condition:
            lambda: return id(n_lampade).state >= 2;
          then:
            - delay: 2s
            - switch.turn_on: lampada_2
          else:
            - switch.turn_off: lampada_2
      - if:
          condition:
            lambda: return id(n_lampade).state >= 3;
          then:
            - delay: 2s
            - switch.turn_on: lampada_3
          else:
            - switch.turn_off: lampada_3
  - id: lampade_spegni
    mode: restart
    then:
      - script.stop: lampade_accendi
      - switch.turn_off: lampada_1
      - switch.turn_off: lampada_2
      - switch.turn_off: lampada_3

climate:
  - platform: thermostat
    id: stufa
    name: "Stufa"
    sensor: t_camera
    min_heating_off_time: 60s
    min_heating_run_time: 60s
    min_idle_time: 30s
    heat_deadband: 0.3
    heat_overrun: 0.3
    heat_action:
      - script.execute: lampade_accendi
    idle_action:
      - script.execute: lampade_spegni
    default_preset: Preriscaldo
    preset:
      - name: Preriscaldo
        default_target_temperature_low: 22
    visual:
      min_temperature: 5
      max_temperature: 28
      temperature_step: 0.5

interval:
  # sonda camera ferma da 5 min → niente calore e niente acqua
  - interval: 30s
    then:
      - if:
          condition:
            lambda: return millis() - id(ultima_lettura) > 300000;
          then:
            - if:
                condition:
                  lambda: return id(stufa).mode != climate::CLIMATE_MODE_OFF;
                then:
                  - logger.log:
                      level: WARN
                      format: "Sonda camera ferma da 5 min: stufa spenta"
                  - climate.control:
                      id: stufa
                      mode: "OFF"
            - script.execute: lampade_spegni
            - switch.turn_off: umidificatore_1
            - switch.turn_off: umidificatore_2
  # Velocità delle ventole riscritta al nodo ogni 30 s: se il nodo si è
  # riavviato la riprende, e la scrittura gli fa da segnale di vita (senza
  # scritture per 90 s il nodo porta le ventole al valore di sicurezza).
  - interval: 30s
    then:
      - lambda: |-
          id(pwm_nodo).set_level(id(ventole).state ? id(ventole).speed / 100.0f : 0.0f);

# --- Ventole di ricircolo (sul nodo in camera, via Modbus) --------------------
# Il valore va al registro 0x0010 del nodo in % (0–100); l'inversione per il
# modulo MOSFET la fa il nodo.
output:
  - platform: modbus_controller
    id: pwm_nodo
    modbus_controller_id: nodo
    address: 0x0010
    register_type: holding
    value_type: U_WORD
    multiply: 100

fan:
  - platform: speed
    id: ventole
    name: "Ventole ricircolo"
    output: pwm_nodo
    restore_mode: RESTORE_DEFAULT_OFF

# --- RS485: sonda camera, contatore, sonda cantina, nodo ----------------------
# Il contatore SDM120 esce di fabbrica con indirizzo 1 e 2400 baud: va portato
# a indirizzo 2 e 9600 baud dai tasti frontali PRIMA di collegarlo al bus,
# altrimenti si scontra con la sonda camera (indirizzo 1).
uart:
  id: bus485
  tx_pin: GPIO17
  rx_pin: GPIO18
  baud_rate: 9600

modbus:
  id: modbus485
  uart_id: bus485

modbus_controller:
  - id: sth_camera
    modbus_id: modbus485
    address: 0x1
    update_interval: 30s
  # Seconda S-TH-01 in cantina: togliere il commento quando ha indirizzo 3.
  # - id: sth_cantina
  #   modbus_id: modbus485
  #   address: 0x3
  #   update_interval: 60s
  - id: nodo
    modbus_id: modbus485
    address: 0x4
    update_interval: 15s

binary_sensor:
  # Nodo fermo: il battito non cambia da 60 s (o non è mai arrivato).
  # Peso, superfici e giri non sono più validi; stufa e sonda camera no.
  - platform: template
    name: "Nodo camera non risponde"
    device_class: problem
    lambda: |-
      return id(battito_nodo) < 0 || millis() - id(battito_nodo_cambiato) > 60000;
  - platform: template
    name: "Ventole in sicurezza"
    device_class: problem
    lambda: |-
      float s = id(stato_nodo).state;
      return !isnan(s) && (int(s) & 1) != 0;

sensor:
  # Camera (S-TH-01, indirizzo 1)
  - platform: modbus_controller
    modbus_controller_id: sth_camera
    id: t_camera
    name: "Temperatura camera"
    force_update: true
    register_type: holding
    address: 0x0000
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
    on_value:
      - lambda: id(ultima_lettura) = millis();
      - if:
          condition:
            lambda: return x > ${t_massima};
          then:
            - logger.log:
                level: ERROR
                format: "Camera oltre ${t_massima} °C: stufa spenta"
            - climate.control:
                id: stufa
                mode: "OFF"
            - script.execute: lampade_spegni
  - platform: modbus_controller
    modbus_controller_id: sth_camera
    id: ur_camera
    name: "Umidità camera"
    force_update: true
    register_type: holding
    address: 0x0001
    value_type: U_WORD
    unit_of_measurement: "%"
    device_class: humidity
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.01
  - platform: modbus_controller
    modbus_controller_id: sth_camera
    id: rugiada_camera
    name: "Punto di rugiada camera"
    register_type: holding
    address: 0x0002
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
  - platform: template
    name: "Umidità assoluta camera"
    unit_of_measurement: "g/m³"
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 60s
    lambda: |-
      float t = id(t_camera).state, ur = id(ur_camera).state;
      if (isnan(t) || isnan(ur)) return NAN;
      return 6.112f * expf(17.67f * t / (t + 243.5f)) * ur * 2.1674f / (273.15f + t);

  # Contatore SDM120 (indirizzo 2): consumo delle lampade e degli attuatori
  - platform: sdm_meter
    modbus_id: modbus485
    address: 2
    update_interval: 30s
    phase_a:
      voltage:
        name: "Tensione"
      current:
        name: "Corrente attuatori"
      active_power:
        name: "Potenza attuatori"
      power_factor:
        name: "Fattore di potenza"
    total_power:
      name: "Potenza totale"
    import_active_energy:
      name: "Energia attuatori"

  # Nodo in camera (indirizzo 4): mappa dei registri in salumi-nodo.yaml.
  # I valori non validi arrivano come −32768 (o INT32_MIN per il peso) e
  # diventano "non disponibile".
  - platform: modbus_controller
    modbus_controller_id: nodo
    id: battito_nodo_reg
    name: "Battito nodo"
    entity_category: diagnostic
    internal: true
    force_update: true
    register_type: holding
    address: 0x0001
    value_type: U_WORD
    on_value:
      - lambda: |-
          int b = (int) x;
          if (b != id(battito_nodo)) {
            id(battito_nodo) = b;
            id(battito_nodo_cambiato) = millis();
          }
  - platform: modbus_controller
    modbus_controller_id: nodo
    id: peso_grezzo
    name: "Peso grezzo"
    entity_category: diagnostic
    register_type: holding
    address: 0x0002
    value_type: S_DWORD
    accuracy_decimals: 0
    filters:
      - lambda: |-
          if (x <= -2147483648.0f) return {};
          return x;
  - platform: modbus_controller
    modbus_controller_id: nodo
    id: t_parete
    name: "Temperatura parete"
    register_type: holding
    address: 0x0004
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - lambda: |-
          if (x == -32768) return {};
          return x * 0.01f;
  - platform: modbus_controller
    modbus_controller_id: nodo
    id: t_pavimento
    name: "Temperatura pavimento"
    register_type: holding
    address: 0x0005
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - lambda: |-
          if (x == -32768) return {};
          return x * 0.01f;
  - platform: modbus_controller
    modbus_controller_id: nodo
    name: "Giri ventola 1"
    register_type: holding
    address: 0x0006
    value_type: U_WORD
    unit_of_measurement: "rpm"
    accuracy_decimals: 0
  - platform: modbus_controller
    modbus_controller_id: nodo
    name: "Giri ventola 2"
    register_type: holding
    address: 0x0007
    value_type: U_WORD
    unit_of_measurement: "rpm"
    accuracy_decimals: 0
  - platform: modbus_controller
    modbus_controller_id: nodo
    name: "PWM ventole applicato"
    register_type: holding
    address: 0x0008
    value_type: U_WORD
    unit_of_measurement: "%"
    accuracy_decimals: 0
  - platform: modbus_controller
    modbus_controller_id: nodo
    id: stato_nodo
    name: "Stato nodo"
    entity_category: diagnostic
    internal: true
    register_type: holding
    address: 0x0009
    value_type: U_WORD

  # Superfici: la più fredda tra parete e pavimento, confrontata con il
  # punto di rugiada dell'aria (specifiche_firmware.md §6.1).
  - platform: template
    id: t_fredda
    name: "Superficie più fredda"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 30s
    lambda: |-
      float a = id(t_parete).state, b = id(t_pavimento).state;
      if (isnan(a)) return b;
      if (isnan(b)) return a;
      return std::min(a, b);
  - platform: template
    name: "Margine di condensa"
    unit_of_measurement: "°C"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 30s
    lambda: |-
      return id(t_fredda).state - id(rugiada_camera).state;

  # Bilancia: "Peso grezzo" (dal nodo) serve a calibrare. Leggerlo a vuoto
  # (gancio compreso) e con un peso noto, poi mettere i due valori qui.
  - platform: copy
    source_id: peso_grezzo
    name: "Peso"
    unit_of_measurement: g
    device_class: weight
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - calibrate_linear:
          # DA CALIBRARE: lettura grezza -> grammi
          - 0 -> 0
          - 100000 -> 1000

  - platform: wifi_signal
    name: "Segnale WiFi"
    update_interval: 60s
  - platform: uptime
    name: "Tempo acceso"
    update_interval: 60s

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "Indirizzo IP"
  - platform: debug
    reset_reason:
      name: "Motivo ultimo riavvio"
